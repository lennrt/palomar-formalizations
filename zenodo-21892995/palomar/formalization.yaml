# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An explicit periodic signing of C_n(1,2) below the conjectured minimum"
  description: >-
    The paper's disproof of Suvagiya's signed-circulant minimum conjecture on
    an infinite arithmetic progression, formalized at the matrix level. For
    every n divisible by 8, Lean defines the paper's period-8 triangle-flux
    signing of the circulant graph C_n(1,2) as an explicit signed adjacency
    matrix, proves it is a plus-minus-one signing of mathlib's circulant
    graph, and proves by exact rational sum-of-squares window certificates
    that every eigenvalue has absolute value at most 1397/500. For every
    n >= 32 this rational separator lies strictly below the conjectured
    minimum rho_-(n) = 2*sqrt(cos^2(pi/n)+cos^2(2pi/n)), so the conjectured
    value is beaten by an explicit signing on all of n = 0 mod 8, n >= 32.
    The full Bloch determinant identity and the all-phase algebraic band-edge
    certificate remain selected as the supporting layer.
  authors:
    - "Lennart Rudolph"
  license: "MIT"
  responsible_maintainers:
    - "Lennart Rudolph"

classification:
  arxiv: ["math.CO", "math.SP"]
  msc2020: ["05C22", "05C50", "68R10", "15A18"]

sources:
  - title: "Periodic Signings of C_n(1,2): An Exact Band Edge and Short-Period Classification"
    authors:
      - "Lennart Rudolph"
    id: "10.5281/zenodo.21892995"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21892995"
    relationship: "formalizes"
    note: >-
      Formalizes the disproof clause of Theorem 2.1 at the rational separator
      1397/500 used by Proposition 2.2, uniformly in the quotient order, and
      the displayed Bloch matrix with its determinant identity and all-phase
      band-edge certificate. The exact band-edge value sqrt(t0), the infinite
      operator, the direct-integral and spectral-theorem steps, and the
      period-at-most-16 classification remain external.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Signed circulants at the Ramanujan bound"
    authors: ["Vaibhav Suvagiya"]
    id: "arXiv:2607.18334"
    type: paper
    location: "https://arxiv.org/abs/2607.18334"
    relationship: "background"
    note: >-
      Conjecture 3 there proposes rho_-(n) as the minimum spectral radius over
      all signings of C_n(1,2) for every even n >= 8. The compared headline
      theorem exhibits, for every n = 0 mod 8 with n >= 32, an explicit
      signing whose eigenvalues all lie strictly below rho_-(n).
    license: "arXiv.org perpetual non-exclusive license"
    author_endorsement: "none"

status:
  scope: >-
    The new layer defines the period-8 flux word, the induced step-2 signs on
    ZMod n through the reduction ZMod n -> ZMod 8, and the signed adjacency
    matrix of C_n(1,2) with positive step-1 edges. Compared theorems: the
    matrix is a plus-minus-one signing of mathlib's circulantGraph {1,2}; the
    Rayleigh quotient bound |v^T A v| <= (1397/500)|v|^2 for every real
    vector, proved by two exact rational sum-of-squares window certificates
    (period-8 local quadratic forms summing telescopically to
    (1397/500)I -/+ A); the eigenvalue corollary |mu| <= 1397/500 for every
    real eigenpair; the strict comparison 1397/500 < rho_-(n) for n >= 32 via
    the nested-radical bounds; and the bundled disproof statement. The
    supporting layer is unchanged: the exact Bloch symbol, its fraction-free
    determinant expansion, det(xI-B(z)) = F(x^2,z+z^{-1}), and the all-phase
    algebraic band-edge certificate. Not formalized: the identification of
    the common spectral radius with sqrt(t0) (both directions), the infinite
    operator and its direct integral, Sturm's theorem, and the exhaustive
    short-period classification of Theorem 4.1.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarSignedCirculant.periodic_signing_beats_twisted_class"
    - "PalomarSignedCirculant.eigenvalue_band_bound"
    - "PalomarSignedCirculant.rayleigh_band_bound"
    - "PalomarSignedCirculant.separator_lt_twisted_value"
    - "PalomarSignedCirculant.signedAdjacency_isCirculantSigning"
    - "PalomarSignedCirculant.bloch_symbol_phase_reversal"
    - "PalomarSignedCirculant.bloch_determinant_with_correction"
    - "PalomarSignedCirculant.bloch_determinant_identity"
    - "PalomarSignedCirculant.algebraic_band_edge_certificate"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "Codex and Claude"
      tool_setup: "Agent-assisted formal proof development and automated adversarial review"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and hosted APIs"
      prompting_notes: >-
        Iterative proof construction, exact-certificate checks, and audit
        prompts. The sum-of-squares window data was computed externally by a
        periodic Cholesky factorization and rounded to exact rationals whose
        certificate identities Lean re-proves from scratch; the discovery
        computation is not trusted by any compared proof.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Human mathematical review with Lean and Mathlib tactics"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based; exact total not tracked"
  notes: >-
    Lennart Rudolph made the editorial decisions and is responsible for the
    formalization. Sol and Fable contributed proof development and
    mathematical checking as automated assistants.

fidelity:
  divergences: >-
    The paper proves the family bound through the Bloch determinant, Sturm
    certificates, and phase monotonicity, and obtains the exact common radius
    sqrt(t0); the formalization proves the slightly weaker rational bound
    1397/500 (the same separator Proposition 2.2 uses) directly at the level
    of finite quadratic forms, by period-8 sum-of-squares window certificates
    valid for every quotient order at once. The conjectured value rho_-(n) is
    defined by its closed trigonometric formula; the comparison uses the
    paper's nested-radical bounds together with cosine monotonicity rather
    than a monotonicity claim about rho_- itself. The eigenvalue statements
    quantify over real eigenpairs of the real symmetric matrix. For such a
    matrix that is the whole spectrum, but the formalization does not import
    the spectral theorem and does not assert it: the bound is proved directly
    for real eigenpairs, and no complex-spectrum or spectral-radius statement
    is selected. The uniform statement is the Rayleigh bound over all real
    vectors, from which the eigenvalue bound is derived.

review:
  status: "self-assessed"
  reviewers:
    - "OpenAI Codex (Sol)"
    - "Anthropic Claude (Fable)"
  notes: >-
    Anthropic Claude (Fable), an automated assistant, developed and
    adversarially reviewed the new matrix-level disproof layer, checking the
    signing, the certificate identities, and the radical comparison against
    the preprint. OpenAI Codex (Sol), an automated assistant, previously
    checked the Bloch determinant layer term by term against the rendered
    preprint. No independent human peer review has been performed.

alignment:
  namespace: "PalomarSignedCirculant"
  statements:
    - source: "Theorem 2.1, disproof clause: an explicit signing below rho_-(8q) for all q >= 4"
      lean: "PalomarSignedCirculant.periodic_signing_beats_twisted_class"
      module: "Solution"
      status: "proved"
      note: >-
        For every n = 0 mod 8 with n >= 32: the period-8 signing's matrix has
        every eigenvalue strictly below rho_-(n) in absolute value. The exact
        radius sqrt(t0) is not asserted.
    - source: "Proposition 2.2, separator form, uniform in n: all eigenvalues within [-1397/500, 1397/500]"
      lean: "PalomarSignedCirculant.eigenvalue_band_bound"
      module: "Solution"
      status: "proved"
      note: "Real eigenpairs of the explicit signed adjacency matrix, every n = 0 mod 8."
    - source: "Quadratic-form band bound behind Proposition 2.2"
      lean: "PalomarSignedCirculant.rayleigh_band_bound"
      module: "Solution"
      status: "proved"
      note: >-
        |v^T A v| <= (1397/500)|v|^2 by two exact rational sum-of-squares
        window certificates, checked by the kernel.
    - source: "Proposition 2.2, comparison 1397/500 < rho_-(32) and monotone extension"
      lean: "PalomarSignedCirculant.separator_lt_twisted_value"
      module: "Solution"
      status: "proved"
      note: >-
        Via the cos(pi/8) and cos(pi/16) closed forms and the project's
        nested-radical bounds. It assumes only n >= 32; no divisibility
        hypothesis is needed for this comparison.
    - source: "Equation (1): the period-8 signing as a signing of C_n(1,2)"
      lean: "PalomarSignedCirculant.signedAdjacency_isCirculantSigning"
      module: "Solution"
      status: "proved"
      note: "Symmetric, plus-minus-one exactly on mathlib's circulantGraph {1,2} edges, zero elsewhere."
    - source: "Displayed period-eight Bloch matrix and phase reversal"
      lean: "PalomarSignedCirculant.bloch_symbol_phase_reversal"
      module: "Solution"
      status: "proved"
      note: >-
        Swapping z and zInv transposes the exact displayed matrix; at a unit
        complex phase this is the paper's Hermitian symmetry.
    - source: "Fraction-free determinant expansion of the displayed Bloch matrix"
      lean: "PalomarSignedCirculant.bloch_determinant_with_correction"
      module: "Solution"
      status: "proved"
      note: >-
        Strengthens the paper specialization by exhibiting the exact correction
        factor before imposing z*zInv=1.
    - source: "Equations (4)--(5): det(xI-B(z)) = F(x^2,z+z^{-1})"
      lean: "PalomarSignedCirculant.bloch_determinant_identity"
      module: "Solution"
      status: "proved"
      note: "Derived from the exact 8 by 8 determinant under z*zInv=1."
    - source: "All-phase polynomial band-edge argument"
      lean: "PalomarSignedCirculant.algebraic_band_edge_certificate"
      module: "Solution"
      status: "proved"
      note: >-
        Includes the rational root separator and nested-radical comparison,
        F(t0,y) nonnegative on [-2,2] and strict for y<2, and exclusion of all
        roots F(t,y)=0 above t0. It makes no operator-spectrum assertion.

acknowledgements: "Lean, Mathlib, OpenAI Codex, and Anthropic Claude."
