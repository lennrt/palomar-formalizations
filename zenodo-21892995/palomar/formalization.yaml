# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Full Bloch determinant and algebraic band-edge certificates for periodic signed circulants"
  description: >-
    The exact algebraic core of a band-edge theorem for periodic signings of
    C_n(1,2): the paper's full phase-dependent 8 by 8 Bloch symbol, its exact
    bivariate determinant expansion and specialization to F(x^2,z+z^{-1}),
    phase reversal, certified existence and location of the phase-one root,
    nonnegativity at that root for every phase parameter y in [-2,2], and
    exclusion of all-phase determinant zeros above it. The Fourier
    direct-integral and spectral identification remain manuscript arguments.
  authors:
    - "Lennart Rudolph"
    - "Sol"
    - "Fable"
  license: "MIT"
  responsible_maintainers:
    - "Lennart Rudolph"

classification:
  arxiv: ["math.CO", "math.SP"]
  msc2020: ["05C22", "05C50", "68R10", "15A18"]

sources:
  - title: "Periodic Signings of C_n(1,2): An Exact Band Edge and Short-Period Classification"
    authors:
      - "Lennart Rudolph"
      - "Sol"
      - "Fable"
    id: "10.5281/zenodo.21892995"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21892995"
    relationship: "formalizes"
    note: >-
      Formalizes the displayed full 8 by 8 Bloch matrix, its determinant
      identity, and the all-phase polynomial inequalities and root exclusion.
      It does not formalize the direct-integral/spectral theorem step, finite
      quotient sampling, the 32 by 32 characteristic-polynomial/Sturm
      computation, or the exhaustive period-at-most-16 classification.
    license: "CC-BY-4.0"
    author_endorsement: "participated"

status:
  scope: >-
    The project defines the paper's exact full Bloch symbol using independent
    variables z and zInv, proves a fraction-free determinant expansion whose
    correction is divisible by z*zInv-1, derives det(xI-B(z)) =
    F(x^2,z+z^{-1}), proves phase-reversal symmetry, and packages the root
    separator, nested-radical comparison, all-phase nonnegativity, strictness
    away from phase one, and exclusion of all determinant zeros above the
    certified root. It does not assert that this algebraic root is the operator
    norm or a finite-quotient spectral limit; those Fourier, direct-integral,
    and spectral-theorem steps remain external. It also omits the 32 by 32
    Sturm certificate and short-period classification.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarSignedCirculant.bloch_symbol_phase_reversal"
    - "PalomarSignedCirculant.bloch_determinant_with_correction"
    - "PalomarSignedCirculant.bloch_determinant_identity"
    - "PalomarSignedCirculant.algebraic_band_edge_certificate"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "Codex and Claude"
      tool_setup: "Agent-assisted formal proof development and automated adversarial review"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and hosted APIs"
      prompting_notes: "Iterative proof construction, exact-certificate checks, and audit prompts"
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Human mathematical review with Lean and Mathlib tactics"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based; exact total not tracked"
  notes: >-
    The three named authors contributed to proof development, mathematical
    checking, and editorial decisions for the formalization.

fidelity:
  divergences: >-
    The exact displayed Bloch matrix and its determinant identity are included,
    but the submission deliberately stops at the all-phase algebraic band-edge
    certificate. It does not claim the paper's end-to-end spectral result or
    its finite short-period classification.

review:
  status: "self-assessed"
  reviewers:
    - "OpenAI Codex (Sol)"
  notes: >-
    OpenAI Codex (Sol), acting as a co-author, checked the upgraded statements
    term by term against the rendered preprint while developing and mechanically
    testing the proofs. An earlier Fable co-author adversarial self-review
    applied to the older phase-one-only selection and is not represented as
    review of this upgraded compared theorem set. No independent human peer
    review has been performed.

alignment:
  namespace: "PalomarSignedCirculant"
  statements:
    - source: "Displayed period-eight Bloch matrix and phase reversal"
      lean: "PalomarSignedCirculant.bloch_symbol_phase_reversal"
      module: "Solution"
      status: "proved"
      note: >-
        Swapping z and zInv transposes the exact displayed matrix; at a unit
        complex phase this is the paper's Hermitian symmetry.
    - source: "Fraction-free determinant expansion of the displayed Bloch matrix"
      lean: "PalomarSignedCirculant.bloch_determinant_with_correction"
      module: "Solution"
      status: "proved"
      note: >-
        Strengthens the paper specialization by exhibiting the exact correction
        factor before imposing z*zInv=1.
    - source: "Equations (4)--(5): det(xI-B(z)) = F(x^2,z+z^{-1})"
      lean: "PalomarSignedCirculant.bloch_determinant_identity"
      module: "Solution"
      status: "proved"
      note: "Derived from the exact 8 by 8 determinant under z*zInv=1."
    - source: "All-phase polynomial band-edge argument"
      lean: "PalomarSignedCirculant.algebraic_band_edge_certificate"
      module: "Solution"
      status: "proved"
      note: >-
        Includes the rational root separator and nested-radical comparison,
        F(t0,y) nonnegative on [-2,2] and strict for y<2, and exclusion of all
        roots F(t,y)=0 above t0. It makes no operator-spectrum assertion.

acknowledgements: "Lean, Mathlib, OpenAI Codex, and Anthropic Claude."
