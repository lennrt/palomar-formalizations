# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Released all-valence outer double-ring spectrum for cubic subdivision"
  description: >-
    A Lean formalization of Lemma 7.1 and the outer-matrix content of Theorem
    7.2 for generalized cubic subdivision. It defines the naturally indexed
    28n by 28n outer matrix row-by-row from the authenticated released MATLAB
    masks, including all previous/current/next-sector references. It constructs
    the paper's explicit topological permutation, proves that the first 24n
    coordinates are strictly upper triangular and that the remaining diagonal
    components are n scalar 1/64 blocks and n copies of the displayed 3 by 3
    core, and proves unconditionally for every n at least 3 the characteristic
    polynomial X^(24n)(X-1/64)^n(X-1/32)^n(X-1/16)^n(X-1/8)^n.
  authors:
    - "Lennart Rudolph"
    - "Sol"
    - "Fable"
  license: "MIT"
  responsible_maintainers:
    - "Lennart Rudolph"

classification:
  arxiv: ["cs.GR", "math.NA"]
  msc2020: ["15A18", "65D07", "65D17", "65F15"]

sources:
  - title: "Exact Spectra of Generalized Cubic Subdivision Matrices"
    authors:
      - "Lennart Rudolph"
      - "Sol"
      - "Fable"
    id: "doi:10.5281/zenodo.21925578"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21925578"
    relationship: "formalizes"
    note: >-
      Formalizes the exact outer row data/support in Lemma 7.1 and the
      topological-permutation and characteristic-polynomial argument in
      Theorem 7.2. The decisive released routine is
      computeBiCubicSubdivisionMatrixBig.m, Git blob ecf810899065 and SHA-256
      82767dc59f57bdf1c9c3e330d8791cef65a74666521666c99b779fdae98d5836.
    license: "CC-BY-4.0"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The project defines all 28 outer roles in every sector and the exact
    rational entries of the restricted released outer matrix Q_n. It defines
    the cyclic sector maps, the explicit equivalence sending
    {24_s,25_s,29_(s+1)} to one 3-coordinate core, and the extracted zero,
    upper-coupling, singleton, and core blocks. It proves the source-indexed
    matrix equals the block normal form, proves the 24n zero block is strictly
    upper triangular, and proves the complete characteristic polynomial with
    algebraic multiplicities 24n,n,n,n,n for every n at least 3. It does not
    formalize a MATLAB parser/evaluator or a cryptographic proof that the
    external file has the stated digest; the row-by-row Lean definition was
    audited against that pinned file. It also does not formalize the central
    S_n Fourier decomposition, Corollary 7.3, tensor-product volume results,
    fully irregular volume matrices, or a complete C1 theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarCubicHalfSpectrum.released_outer_source_normal_form"
    - "PalomarCubicHalfSpectrum.released_zero_block_strictly_upper"
    - "PalomarCubicHalfSpectrum.outer_core_charpoly"
    - "PalomarCubicHalfSpectrum.outer_normal_form_charpoly"
    - "PalomarCubicHalfSpectrum.released_outer_charpoly"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "OpenAI Codex and Anthropic Claude"
      tool_setup: "Agent-assisted source audit, exact algebra, Lean development, verification, and adversarial review"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based; not tracked"
        hardware: "local machine and hosted APIs"
      prompting_notes: "Human-directed iterative source reconstruction, certificate construction, and review"
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Human source reconstruction, row audit, scope selection, code review, and release approval"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
