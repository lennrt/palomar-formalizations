    The authors are Lennart Rudolph, Sol, and Fable. Lennart Rudolph directed
    the work, checked the retained statements and proofs, and approved the
    release.

fidelity:
  divergences: >-
    The outer matrix, sector gluing, source-to-normal permutation, strict
    triangular support consequence, core block, and full characteristic
    polynomial are formalized. What remains external is provenance from the
    authenticated MATLAB syntax to the row-by-row Lean definition: Lean does
    not parse the routine or verify its Git/SHA digests. The central matrix and
    later full-scheme and volume conclusions are outside this project.

review:
  status: "self-assessed"
  reviewers:
    - "OpenAI Codex (Sol)"
  notes: >-
    OpenAI Codex (Sol), acting as a co-author, checked every encoded outer row
    against the pinned released routine and checked the theorem statements
    against the rendered preprint while developing and mechanically testing the
    proofs. This was automated co-author self-review; no independent human peer
    review has been performed.

alignment:
  namespace: "PalomarCubicHalfSpectrum"
  statements:
    - source: "Lemma 7.1 outer support and Theorem 7.2 topological permutation"
      lean: "PalomarCubicHalfSpectrum.released_outer_source_normal_form"
      module: "CubicHalfSpectrum.ReleasedOuter"
      status: "proved"
      note: >-
        Reindexes the row-by-row source model by the explicit paper permutation
        and proves entrywise equality with the nested upper-block normal form.
    - source: "Theorem 7.2 topologically ordered zero components"
      lean: "PalomarCubicHalfSpectrum.released_zero_block_strictly_upper"
      module: "CubicHalfSpectrum.ReleasedOuter"
      status: "proved"
      note: >-
        Proves that every nonzero zero-role dependency strictly increases the
        displayed role rank and hence that the entire 24n block is strictly
        upper triangular.
    - source: "Theorem 7.2 displayed outer core H"
      lean: "PalomarCubicHalfSpectrum.outer_core_charpoly"
      module: "CubicHalfSpectrum.ReleasedOuter"
      status: "proved"
      note: >-
        Computes Matrix.charpoly of the exact displayed 3 by 3 matrix as the
        factors X-1/8, X-1/16, and X-1/32.
    - source: "Theorem 7.2 block upper-triangular characteristic polynomial"
      lean: "PalomarCubicHalfSpectrum.outer_normal_form_charpoly"
      module: "CubicHalfSpectrum.ReleasedOuter"
      status: "proved"
      note: >-
        Proves the full 28n-dimensional polynomial for arbitrary one-way star
        couplings once the 24n block is strictly upper triangular.
    - source: "Theorem 7.2 released outer double-ring spectrum"
      lean: "PalomarCubicHalfSpectrum.released_outer_charpoly"
      module: "CubicHalfSpectrum.ReleasedOuter"
      status: "proved"
      note: >-
        Gives the stated characteristic polynomial directly for releasedOuterQ
        for every n at least 3, with no supplied permutation-equality premise.

acknowledgements: "Lean, Mathlib, OpenAI Codex, and Anthropic Claude."
