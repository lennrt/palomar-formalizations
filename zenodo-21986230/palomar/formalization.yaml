# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An explicit obstruction to uniform two-word π-representability"
  description: >-
    A Lean formalization of the paper's standard finite-word semantics for
    k-uniform two-word π-representability, its neighbourhood-trace bound
    binomial(k(|A|+1),k)^2, the explicit 20-by-741322 bit-incidence graph B20,
    and the theorem that B20 is not representable by two 2-uniform words. It
    also retains the companion's token-order bridge and exact arithmetic
    endpoints.
  authors:
    - "Lennart Rudolph"
    - "Sol"
    - "Fable"
  license: "MIT"
  responsible_maintainers:
    - "Lennart Rudolph"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C62", "05C75", "06A07", "68R15"]

sources:
  - title: "An Explicit Obstruction to Uniform Two-Word π-Representability"
    authors:
      - "Lennart Rudolph"
      - "Sol"
      - "Fable"
    id: "10.5281/zenodo.21986230"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21986230"
    relationship: "formalizes"
    note: >-
      Formalizes the word definitions, Theorem 3.1's trace bound in an
      equivalent finite-family form, Theorem 4.1's explicit B20 obstruction,
      and the earlier order and arithmetic companion lemmas.
    license: "CC-BY-4.0"
    author_endorsement: "participated"

status:
  scope: >-
    The project defines finite words, k-uniformity, two-word
    π-representability, neighbourhood traces, and B20. It proves the general
    stars-and-bars trace bound and the explicit B20 nonmembership theorem. The
    paper's separate permutation-graph compaction characterization and its
    VC-dimension consequences remain outside the formalized scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarG2.fibre_agreement_iff_no_cross_inversion"
    - "PalomarG2.same_fibre_no_inversion"
    - "PalomarG2.trace_capacity_endpoint"
    - "PalomarG2.no_trace_code_injection"
    - "PalomarG2.neighborhood_trace_bound"
    - "PalomarG2.B20_not_twoWordPiRepresentable"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "Codex and Claude"
      tool_setup: "Agent-assisted proof development, checking, and adversarial review"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and hosted APIs"
      prompting_notes: "Iterative theorem design, proof repair, and audit prompts"
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Human mathematical and editorial review with Mathlib tactics"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based; exact total not tracked"
  notes: >-
    The authors are Lennart Rudolph, Sol, and Fable. Lennart Rudolph selected
    the statements, reviewed the proof boundary, and takes responsibility for
    the submission.

fidelity:
  divergences: >-
    The trace bound is stated in the equivalent finite-family form: every
    outside family on which the neighbourhood-trace map is injective has the
    stated cardinality bound. The permutation-graph characterization and
    VC-dimension corollaries are not formalized.

review:
  status: "self-assessed"
  reviewers:
    - "OpenAI Codex (Sol)"
  notes: >-
    Sol, acting as a co-author, checked the upgraded definitions term by term
    against the rendered source and developed the Lean proofs. The earlier
    scoped release received a Fable co-author self-audit. The upgraded
    statements have not received independent human peer review.

alignment:
  namespace: "PalomarG2"
  statements:
    - source: "Theorem 3.1 (neighbourhood-trace bound)"
      lean: "PalomarG2.neighborhood_trace_bound"
      module: "Solution"
      status: "proved"
      note: >-
        Equivalent finite-family formulation, using the k occupied positions
        in each restricted word as the choose(k(|A|+1),k) code.
    - source: "Theorem 4.1 (B20 is not in G2)"
      lean: "PalomarG2.B20_not_twoWordPiRepresentable"
      module: "Solution"
      status: "proved"
      note: >-
        Uses the paper's 20 left vertices, 741322 right vertices, and
        least-significant-bit incidence relation.
    - source: "Projection--inversion bridge lemma"
      lean: "PalomarG2.fibre_agreement_iff_no_cross_inversion"
      module: "Solution"
      status: "proved"
      note: "Token-order form for two genuine linear orders and distinct fibres."
    - source: "Same-fibre independence step"
      lean: "PalomarG2.same_fibre_no_inversion"
      module: "Solution"
      status: "proved"
      note: "Assumes both orders respect the occurrence indices."
    - source: "Neighbourhood-trace calculation for k = 2, m = 20"
      lean: "PalomarG2.trace_capacity_endpoint"
      module: "Solution"
      status: "proved"
      note: "Exact numerical endpoint only."
    - source: "Finite pigeonhole endpoint of the obstruction"
      lean: "PalomarG2.no_trace_code_injection"
      module: "Solution"
      status: "proved"
      note: "Rules out an injection from 741322 traces to 741321 codes."

acknowledgements: "Lean, Mathlib, OpenAI Codex, and Anthropic Claude."
