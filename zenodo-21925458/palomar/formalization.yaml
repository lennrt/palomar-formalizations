# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A three-landmark multiset resolving set for even cylindrical graphs"
  description: >-
    A concrete formalization of the infinite-family construction in the source:
    cycle and Cartesian-product distances on P_m □ C_(6m), the displayed
    landmarks (0,0), (0,2m), and (m-1,0), the four-piece cycle distance-pair
    locus, and injectivity of the resulting unordered multiset code for every
    even m at least 2. This establishes the three-landmark resolving upper
    bound. It does not formalize the separate general lower bound needed to
    conclude that the set is a basis or that the multiset dimension equals 3.
  authors:
    - "Lennart Rudolph"
    - "Sol"
    - "Fable"
  license: "MIT"
  responsible_maintainers:
    - "Lennart Rudolph"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C12", "05C76", "68R10"]

sources:
  - title: "Multiset Dimension of Cylindrical Graphs: An Infinite Family and a Certified Census"
    authors:
      - "Lennart Rudolph"
      - "Sol"
      - "Fable"
    id: "10.5281/zenodo.21925458"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21925458"
    relationship: "formalizes"
    note: >-
      Formalizes Lemma 1 and the resolving-set half of Theorem 2. The source's
      final lower-bound appeal, exact dimension equality, basis minimality,
      and finite exhaustive census are outside the Lean scope.
    license: "CC-BY-4.0"
    author_endorsement: "participated"

status:
  scope: >-
    The project defines the concrete vertex type Fin m × Fin (6m), the standard
    cycle and Cartesian-product distance formulas, the paper's three displayed
    landmarks, unordered multiset codes, and the resolving property. It proves
    the complete four-piece cycle distance-pair locus and its injectivity, then
    proves that the displayed landmarks resolve P_m □ C_(6m) for every even
    m ≥ 2. It does not define or prove the minimum over all landmark sets, and
    therefore does not claim basis minimality or dim_m(P_m □ C_(6m)) = 3.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarMSET25.cycle_distance_pair_locus"
    - "PalomarMSET25.cycle_distance_pair_injective"
    - "PalomarMSET25.even_cylinder_three_landmarks_resolve"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "Codex and Claude"
      tool_setup: "Agent-assisted formalization and adversarial audit"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and hosted APIs"
      prompting_notes: "Iterative statement extraction, proof checking, and review prompts"
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Human mathematical and editorial review with Lean and Mathlib tactics"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based; exact total not tracked"
  notes: >-
    The three named authors collaborated on the scope, statements, review,
    and responsibility for the formalization.

fidelity:
  divergences: >-
    The Lean development uses the paper's explicit coordinate distance formula
    rather than Mathlib's SimpleGraph Cartesian-product distance. It formalizes
    the resolving-set construction and cycle-locus lemma, but not the external
    theorem that a connected non-path graph has multiset dimension at least 3;
    consequently it does not formalize basis minimality or exact dimension.

review:
  status: "self-assessed"
  reviewers:
    - "OpenAI Codex (Sol)"
    - "Anthropic Claude (Fable)"
  notes: >-
    OpenAI Codex (Sol), acting as a co-author, performed a line-by-line
    source-fidelity self-audit of the upgraded statements and proof structure
    against Lemma 1 and Theorem 2. Fable's earlier co-author adversarial
    self-review covered the arithmetic package. No independent human peer
    review has been performed.

alignment:
  namespace: "PalomarMSET25"
  statements:
    - source: "Lemma 1, Equation (5): four-piece cycle distance-pair locus"
      lean: "PalomarMSET25.cycle_distance_pair_locus"
      module: "Solution"
      status: "proved"
      note: "Uses the same half-open cycle-column range through Fin (6*m)."
    - source: "Lemma 1: the distance pair determines the cycle column modulo 6m"
      lean: "PalomarMSET25.cycle_distance_pair_injective"
      module: "Solution"
      status: "proved"
      note: "Injectivity of distances to columns 0 and 2m."
    - source: "Theorem 2: the displayed landmarks resolve P_m □ C_(6m) for even m ≥ 2"
      lean: "PalomarMSET25.even_cylinder_three_landmarks_resolve"
      module: "Solution"
      status: "proved"
      note: >-
        Formalizes the resolving assertion, not the final general lower-bound
        step that upgrades the resolving set to a basis of exact dimension 3.

acknowledgements: "Lean, Mathlib, OpenAI Codex, and Anthropic Claude."
