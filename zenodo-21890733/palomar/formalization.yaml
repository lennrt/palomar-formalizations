version: "v0.4"

project:
  name: "Finite obstruction to prescribed-cycle recovery in a Barnette graph"
  description: >-
    This Lean development formalizes the decisive finite obstruction used for
    the explicit prescribed-cycle counterexample: the eight-edge matching
    omitted by the displayed Hamiltonian cycle meets each of the three
    displayed edge-color classes. It also proves the abstract implication that
    an output containing every forced green edge cannot equal a cycle that
    omits a green matching edge. The planar embedding, derivation and uniqueness
    of the simultaneous coloring, Hamiltonicity checks, and the published
    algorithm's Property 1 are outside the compared statement surface.
  authors: ["Lennart Rudolph"]
  responsible_maintainers: ["Lennart Rudolph"]
  license: "MIT"

classification:
  arxiv: [math.CO, cs.CG]
  msc2020: [05C10, 05C45, 68R10]

sources:
  - title: "A Counterexample to Prescribed-Cycle Recovery in Barnette Graphs"
    authors: ["Lennart Rudolph"]
    id: "doi:10.5281/zenodo.21890733"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21890733"
    relationship: formalizes
    note: >-
      The compared declarations formalize the matching-versus-color
      obstruction and its final forced-edge implication, not the complete paper.
    license: "CC-BY-4.0"

status:
  scope: >-
    Finite matching-versus-color intersection and the generic forced-edge
    implication only; the embedding, full certificate chain, and external
    algorithm theorem are not compared.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]

automation:
  methods:
    - method: agent
      models: ["OpenAI Codex", "Anthropic Claude"]
      framework: "AI-assisted formalization and adversarial review"
      tool_setup: "Lean 4, Mathlib, exact certificate checks, and agent review"
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: "Author-directed mathematical and editorial verification"
  spend_usd: "not tracked"
  notes: >-
    Agents assisted substantially; the author made the final mathematical and
    editorial decisions and accepts responsibility for the submitted result.

fidelity:
  divergences: >-
    The compared Lean result is deliberately narrower than the paper and treats
    the algorithmic forced-edge property as an external premise.

review:
  status: "agent-reviewed"
  reviewers: ["Anthropic Claude"]
  notes: "The release records independent adversarial review and exact verification."

alignment:
  namespace: "BarnettePalomar"
  statements:
    - source: "Finite matching-versus-color obstruction"
      lean: "BarnettePalomar.concrete_matching_meets_every_color"
      module: "Solution"
      status: proved
      note: "Checks the concrete three-color intersection used in the obstruction."
    - source: "Forced-green final implication"
      lean: "BarnettePalomar.forced_green_excludes_prescribed_cycle"
      module: "Solution"
      status: proved
      note: "Abstracts the last logical step while leaving Property 1 external."

acknowledgements: "Mathlib, Lean, and the source works cited in the preprint."
