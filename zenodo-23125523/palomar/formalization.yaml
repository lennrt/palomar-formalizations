version: v0.4
project:
  name: 'Distance-Shell Tomography: Geometric Certificates for Fault-Tolerant Sensing,
    Moment Compression, and Hypercube Equalization'
  description: Substantive Lean development for labelled distance-shell observations
    of anonymous integer populations. The focused 14-statement interface covers six
    result groups. Square grids have an exact four-corner interval-cut characterization
    of recovery of all populations of mass at most two after one erased report, an
    equivalent distance-sum compression contract, and exact corner-constrained optimum
    ceil(3(n+1)/2) for every n at least 3. For every positive q, the actual-distance
    equalizer cardinality of Q_(4q) lies between 2^(4q-1)+2q-1 and 2^(4q-1)+2q; explicit
    prefixes also give the infinite contradiction to the sourced exponential formula.
    Further selected results prove the long-rectangle optimum, ordinary 2-domination
    on every positive even bishop board, two exact Petersen double-total-domination
    values, and a connected real fractional-face counterexample. The complete library
    is included, not an external or assumption-based wrapper. Supporting algebra and
    geometric lemmas remain proved but unselected. The public README explains mathematical
    scope, antecedents, and limitations without treating known ingredients or all
    supporting lemmas as separate original results.
  authors:
  - Lennart Rudolph
  responsible_maintainers:
  - Lennart Rudolph
  license: MIT
