fidelity:
  divergences: Grid reports preserve multiplicity and sensor labels. Populations have
    natural occupancies and mass at most two, including empty and repeated-target
    cases. The erased final report is identified as missing; internal communication
    loss and noisy acquisition are outside this theorem. Compression retains full
    reports at four corners and scalar total distances elsewhere. The exact square
    count assumes those corners; the stronger unrestricted lower bound and its attained
    finite placements in the paper are not selected Lean statements. Hypercube equalization
    quantifies over distinct vertices outside the selected set using actual shortest-path
    distance. Its within-one endpoint gives an explicit upper witness and a lower
    bound for every equalizer; it does not formalize the quotient domination number
    as a separate object. The bishop parameter is ordinary 2-domination; the Petersen
    parameter requires two selected neighbors at every vertex. The fractional counterexample
    uses full real-valued optimal faces. Exact folded-cube values in dimensions 8,
    12, and 16 are exhaustive computations, not kernel certificates. The general quantitative
    polynomial balancing theorem and the full moment capacity/report-distance results
    are paper-level statements beyond the selected interface; their supporting formal
    lemmas do not conceal those missing bridges. No first-refutation priority is asserted
    for the Petersen examples. Existing parity geometry, balancing, rook patterns,
    and imported tomography foundations are credited as prior work.
