fidelity:
  divergences: >-
    The selected probabilities and moments are real; supporting exact-recovery
    theorems are more general over linearly ordered fields. Populations have
    natural entries and all compared legs have equal finite length. No separate
    cross-length padding theorem is asserted. The endpoint trace converse
    requires the surviving horizon. The mean theorem covers paths, not the
    paper's arbitrary-tree generalization. Difference rounding is conditional
    on correct deepest-index and positive-magnitude identification and explicit
    covariance-column accuracy. Bernstein concentration, simultaneous good-event
    probability, sample-splitting independence, and the complete minimax
    composition remain written proofs. The all-length testing lower bound has
    coefficient n/2 rather than the paper's sharper n; its actual report
    experiments and randomized tests are fully explicit. The general-tree
    landing and recursion formulas, unknown-rate calibration, spider moment
    obstruction, imported trace-reconstruction complexity and simulation transfer,
    derivative-based optimization and tree conjecture are not formalized.
