# formalization.yaml v0.4; canonical paper DOI 10.5281/zenodo.23252713
version: v0.4
project:
  name: 'Lossy Distance-Shell Tomography on Paths: Recovery from Mean and Covariance'
  description: >-
    A substantive Lean development of two-leg identifiability under independent
    relay deletion and nearest-surviving-ancestor bypass. An interior path sensor
    observes anonymous counts at each contracted hop, superimposing both legs.
    For every known real survival probability strictly between zero and one, the
    mean and covariance identify the unordered pair of natural-valued leg
    populations. A sparse interface needs only the covariance diagonal and one
    adaptively selected column. The concrete law is a finite sum over independent
    Bernoulli relay masks. Ten selected statements additionally establish mean/fold
    equivalence, endpoint trace and degenerate-probability semantics, actual-model
    variance bounds, conditional integer reconstruction recurrences, and a
    logarithmic randomized-testing lower bound for actual paths of every length
    at least two. The full finite-sample probability guarantee is not claimed.
  authors:
    - Lennart Rudolph
  responsible_maintainers:
    - Lennart Rudolph
  license: MIT
