status:
  scope: >-
    Ten independently compared real-valued endpoints with natural populations:
    full and sparse covariance recovery, exact law equivalence up to leg exchange,
    mean/fold equivalence, endpoint trace and probability endpoint semantics,
    variance and centered-product bounds, fold and oriented-difference rounding
    under explicit accuracy hypotheses, and the factor-two-weaker all-length
    designed-rate testing lower bound. All thirteen supplied library modules
    are retained. Empty and zero populations are admitted; all compared legs
    have common length. No formal claim of the full concentration or minimax
    upper-bound theorem, arbitrary-tree recovery, calibration, spider obstruction,
    imported trace-complexity results, or conjecture is made.
  sorry_count: 0
  sorry_in_definitions: 0
