  - title: "New bounds on maximal linkless graphs"
    authors: ["Ramin Naimi", "Andrei Pavelescu", "Elena Pavelescu"]
    id: "10.2140/agt.2023.23.2545"
    type: paper
    location: "https://doi.org/10.2140/agt.2023.23.2545"
