    note: >-
      Discrete & Computational Geometry 73(1):197–207, 2025. States the
      three-dimensional Tutte embedding theorem with the K₆ and K₃,₃,₁
      exclusions and asks in its Section 5 whether the K₃,₃,₁ clause is
      necessary; the formalized paper answers this for (BT) topological-ball
