      Algebraic & Geometric Topology 23(6):2545–2559, 2023. Records the graph
      form of the clique-sum theorem that the paper uses (its Theorem 7).
  - title: "Extremal graphs for contractions to K₇"
    authors: ["L. K. Jørgensen"]
    type: paper
    location: "Ars Combinatoria 25C, pages 133–148, 1988"
    relationship: "background"
    note: >-
      Classifies the K₆-minor-free graphs on n ≥ 5 vertices with 4n − 10 edges
      as MP₁-cockades; with Mader's bound (Mathematische Annalen
      178:154–168, 1968) it supplies the hypothesis hcockade of
      structural_theorem.
