  - title: "The Colin de Verdière graph parameter"
    authors: ["Hein van der Holst", "László Lovász", "Alexander Schrijver"]
    type: paper
    location: "Graph Theory and Combinatorial Biology, Bolyai Society Mathematical Studies 7, pages 29–85, 1999"
    relationship: "background"
