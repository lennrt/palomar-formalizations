    contributed proof development and adversarial review.
fidelity:
  divergences: >-
    Cockades are modeled as sequential K₄-attachments of atoms over one
    ambient vertex type, the linearization of the construction tree that
    Proposition 5.3's induction actually walks; supports are vertex sets with
    an explicit edges-within condition, and the disjoint-copy clause of
    Definition 2.3 becomes the requirement that old and new supports meet
    exactly in the attachment clique. The component bound is stated in the
    equivalent three-vertex form: among any three surviving support vertices,
    two are joined after the deletion. Linkless embeddability is not defined
    inside Lean; it is an abstract predicate constrained by the two
    hypotheses the paper takes from the literature, so the compared theorems
    are exactly the paper's conditional mechanism. In the finite layer,
    relative chains and homology are realized by the four-face/six-edge F₂
    coordinate complex, with the proved identification connecting it to the
    induced simplicial pair.
review:
  status: "self-assessed"
  reviewers: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
  notes: >-
    Fable performed the automated adversarial review of the new
    clique-sum layer (statement alignment against Section 5 and the no-sorry
    kernel proof); Sol's earlier automated review covered the finite layer.
    No independent human peer review was performed.
alignment:
  namespace: "K331Tutte"
  statements:
    - source: "Proposition 5.3 (safe clique-sum induction)"
      lean: "K331Tutte.Cockades.safe_cockade_linkless"
      module: "Solution"
      status: "proved"
      note: >-
        Atom linklessness (Lemma 5.1) and the Holst–Lovász–Schrijver
        four-clique specialization (Corollary 2.5) are explicit hypotheses;
        the separator bound is consumed for the final graph only, as in the
        paper.
    - source: "Lemma 5.2 (attachments do not merge old components)"
      lean: "K331Tutte.Cockades.attachment_reachable_transfer"
      module: "Solution"
      status: "proved"
      note: >-
        Stated as reachability transfer from the attached union back to the
        old part, for an arbitrary deleted vertex set.
    - source: "Lemma 7.1 (soundness of the finite model)"
      lean: "K331Tutte.FiniteHomology.Ambient.encoded_induced_four_pair_admissible"
      module: "Solution"
      status: "proved"
      note: "Derives every admissibility clause from actual closure, subcomplex membership, and (BT)."
    - source: "Coordinate relative-chain identification"
      lean: "K331Tutte.FiniteHomology.Ambient.induced_four_coordinate_chain_identification"
      module: "Solution"
      status: "proved"
      note: "Identifies relative faces, d₂ cycles, d₃, and homology equivalence exactly."
    - source: "Lemma 4.3 (four-vertex relative bound)"
      lean: "K331Tutte.FiniteHomology.Ambient.induced_four_clique_relative_homology_bound"
      module: "Solution"
      status: "proved"
      note: "The actual induced relative quotient has at most two F₂ classes."
acknowledgements: "Lean, Mathlib, OpenAI Codex, and Anthropic Claude."
