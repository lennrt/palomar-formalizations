status:
  scope: >-
    Compared: the combinatorial core of Theorem 1.1 (structural_theorem) with
    Corollary 3.6, the Section 4 relative ball duality, Corollary 2.5, and
    Lemma 5.1 as explicit hypotheses; Lemma 5.2 and Proposition 5.3 over
    mathlib SimpleGraph values on an arbitrary vertex type, with linkless
    embeddability an abstract predicate constrained by exactly those
    hypotheses; and Lemma 7.1, the coordinate identification, and Lemma 4.3
    for every finite simplicial pair on Fin n and every injectively labelled
    four-clique under (BT). In structural_theorem the skeleton of the pair is
    a SimpleGraph on Fin n, a four-clique of the skeleton yields a labelled
    four-clique of the pair, and Lemma 4.3 discharges the antecedent of the
    duality hypothesis for each of them. Not formalized: generic rigidity,
    Mader's theorem, Jørgensen's classification, the PL topology of
    Propositions 4.1 and 4.2, the Holst–Lovász–Schrijver theorem, linkless
    embeddability of apex graphs, graph minors, spatial embeddings, and
    Alexa's theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "K331Tutte.Bridge.structural_theorem"
    - "K331Tutte.Cockades.safe_cockade_linkless"
    - "K331Tutte.Cockades.attachment_reachable_transfer"
    - "K331Tutte.FiniteHomology.Ambient.encoded_induced_four_pair_admissible"
    - "K331Tutte.FiniteHomology.Ambient.induced_four_coordinate_chain_identification"
    - "K331Tutte.FiniteHomology.Ambient.induced_four_clique_relative_homology_bound"
