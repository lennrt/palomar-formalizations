version: "v0.4"
project:
  name: "Safe clique-sum induction and the four-clique relative F₂ bound"
  description: >-
    A formalization of the paper's structural mechanism and its finite support
    layer. Over mathlib simple graphs, Lean proves Lemma 5.2 (attachments over
    a clique do not merge old components, by explicit walk surgery) and
    Proposition 5.3 (every graph generated from atoms of at least five
    vertices by K₄-attachments is linklessly embeddable whenever each
    four-clique deletion leaves at most two components), with the
    Holst–Lovász–Schrijver four-clique rule and atom linklessness as explicit
    hypotheses. The ambient four-clique pair bridge of Lemma 7.1 and the
    relative F₂ bound of Lemma 4.3 remain selected as the finite layer that
    supplies that separator hypothesis in the paper. The two layers are not
    joined inside Lean: the paper's route from Lemma 4.3 to the separator
    bound runs through the deletion retraction and relative ball duality of
    Section 4, which are not formalized.
  authors: ["Lennart Rudolph"]
  license: "MIT"
  responsible_maintainers: ["Lennart Rudolph"]
classification:
  arxiv: ["math.CO", "cs.CG"]
  msc2020: ["05C10", "05C40", "05C83", "55N10", "57Q15", "68U05"]
sources:
  - title: "Simpler Graph Conditions for Embedding Tetrahedral Meshes"
    authors: ["Lennart Rudolph"]
    id: "10.5281/zenodo.21925574"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21925574"
    relationship: "formalizes"
    note: >-
      Formalizes the clique-sum induction of Section 5 (Lemma 5.2 and
      Proposition 5.3) over mathlib simple graphs, and the ambient-to-finite
      four-clique bridge of Lemma 7.1 with the relative bound of Lemma 4.3.
      Generic rigidity, Jørgensen's classification, Alexander–Lefschetz
      duality, the Holst–Lovász–Schrijver theorem, and Alexa's embedding
      theorem remain external, as in the paper's own formal-scope statement.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
related_formalizations: []
status:
  scope: >-
    Two layers are compared. The structural layer works with mathlib
    SimpleGraph values on an arbitrary vertex type: graphs carry explicit
    vertex supports with an edges-within discipline, a K₄-attachment is a
    clique sum whose parts meet exactly in a four-clique of both, and
    MP₁-cockades are generated inductively from an abstract atom family by
    such attachments (the linearization of a construction tree). Lemma 5.2 is
    proved by walk induction: any path between old vertices avoiding a deleted
    set is rerouted through the attachment clique. Proposition 5.3 is proved
    by structural induction, transporting the final graph's separator bound
    down the construction via Lemma 5.2. Linkless embeddability enters as an
    abstract predicate constrained exactly by the two explicit hypotheses the
    paper cites: atoms are linklessly embeddable (Lemma 5.1) and the
    Holst–Lovász–Schrijver four-clique specialization (Corollary 2.5). The
    finite layer covers the paper's Section 4 support: the induced
    four-clique pair of a labelled clique in a finite simplicial pair under
    (BT) is admissible, identifies exactly with the Boolean coordinate
    complex, and has relative F₂ quotient with at most two classes. The
    topological-ball realization, rigidity, duality, graph minors, spatial
    embeddings, and Alexa's theorem are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "K331Tutte.Cockades.safe_cockade_linkless"
    - "K331Tutte.Cockades.attachment_reachable_transfer"
    - "K331Tutte.FiniteHomology.Ambient.encoded_induced_four_pair_admissible"
    - "K331Tutte.FiniteHomology.Ambient.induced_four_coordinate_chain_identification"
    - "K331Tutte.FiniteHomology.Ambient.induced_four_clique_relative_homology_bound"
automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "Codex and Claude"
      tool_setup: "Agent-assisted formalization and adversarial audit"
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and hosted APIs"
