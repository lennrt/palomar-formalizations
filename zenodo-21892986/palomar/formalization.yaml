status:
  scope: >-
    Formalizes a finite skew-symmetric Boolean adjacency representation with
    fixed successor order and degree bound; genuine directed vertex-regular
    fixed-endpoint paths; exact regular completion after deletion of a prefix
    and its complementary vertices; the regularity/deletion join; and a
    bounded-fuel ordered exact-oracle-pruned DFS. The selected results prove
    the oracle semantics, soundness, completeness, duplicate-freedom, and the
    output depth bound. They also define an executable streaming DFS trace
    with frame-enter, individual query, frame-resume, output, and exit events.
    The trace's output projection is the enumerator, its terminal event is the
    root exit, and its extracted work profile counts the actual work events.
    For a no-output run, work is at most outBound+1. For a productive run,
    preprocessing through the first output is bounded by descent depth times
    outBound+1; every actual gap between consecutive output events is bounded
    by their retreat/descent distance through the longest common prefix times
    outBound+1; and post-last-output work is bounded by retreat depth times
    outBound+1. It does not implement or verify Goldberg--Karzanov's
    regular-reachability algorithm, its O(|V|+|E|) running time, the derived
    executable wall-clock complexity, or the paper's space bound.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarRegularPathDelay.exact_prefix_deletion_extension"
    - "PalomarRegularPathDelay.exact_oracle_regular_extension"
    - "PalomarRegularPathDelay.ordered_fixed_endpoint_enumerator"
