fidelity:
  divergences: >-
    Lean proves exact ordered enumeration and an operational combinatorial
    event-count certificate. Each exact reachability query is one charged
    event. The executable Goldberg--Karzanov implementation and its
    O(|V|+|E|) per-query analysis remain external, so no wall-clock runtime or
    space theorem is claimed.

review:
  status: "self-assessed"
  reviewers:
    - "Anthropic Claude (Fable)"
    - "OpenAI Codex (Sol)"
  notes: >-
    The earlier Fable co-author review covered the prior four-result selection.
    A later Sol co-author review found that its fourth result bounded a path-pair
    proxy rather than actual evaluator intervals and required an executable
    event trace. The present trace/profile repair responds to that finding.
    Sol then re-audited the repaired result on 2026-08-20 for evaluator
    semantics, statement alignment, and definition fidelity. These were
    co-author self-reviews; no independent human peer review has been performed.

alignment:
  namespace: "PalomarRegularPathDelay"
  statements:
    - source: "Prefix-deletion extension equivalence"
      lean: "PalomarRegularPathDelay.exact_prefix_deletion_extension"
      module: "Solution"
      status: "proved"
      note: >-
        Exact equivalence between a full regular-path extension and a regular
        completion surviving deletion of the prefix and its mates.
    - source: "Exact reachability-oracle pruning criterion"
      lean: "PalomarRegularPathDelay.exact_oracle_regular_extension"
      module: "Solution"
      status: "proved"
      note: >-
        Positive answers on ordered admissible successors are exactly the
        children admitting a fixed-target regular-path extension.
    - source: "Ordered fixed-endpoint enumeration theorem"
      lean: "PalomarRegularPathDelay.ordered_fixed_endpoint_enumerator"
      module: "Solution"
      status: "proved"
      note: >-
        The bounded ordered DFS enumerates exactly all target regular paths,
        without duplicates, and every output has at most |V| vertices.
    - source: "Operational DFS event-trace delay certificate"
      lean: "PalomarRegularPathDelay.explicit_dfs_event_trace_certificate"
      module: "Solution"
      status: "proved"
      note: >-
        The explicit streaming evaluator has exactly the enumerator's output
        projection and terminates at root exit. Its extracted event profile
        gives actual no-output, first-output, consecutive-output, and
        post-last-output work counts with depth/LCP frame bounds. The external
        O(|V|+|E|) cost of one exact query is not formalized.

acknowledgements: "Lean, Mathlib, CSLib, OpenAI Codex, and Anthropic Claude."
