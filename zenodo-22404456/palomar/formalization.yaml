fidelity:
  divergences: >-
    Finite labelled sensor types allow duplicate positions in the product theorem. Lean
    also proves three benign endpoint extensions beyond the paper's displayed domains: the trade
    criterion at h = 0 (the paper states h >= 1), the selected product clauses for an empty
    sensor-label type (the paper assumes a nonempty placement), and vacuous n < 3 cases of the grid
    lower bound because Nat subtraction makes S.card < n-2 impossible there (the paper states n >= 3).
    The substantive grid results retain n >= 6. Actual graph shortest-path distances and literal
    multiplicity-preserving bags are used. The exactly-h equivalence, grid-distance bridge,
    extraction inverse, direct minimum/attainer, and alternating-placement facts are proved in the
    source but are not separately selected. The detector/B-channel/capacity-profile formulations,
    exact detector-cross converse, two-sensor cycle theorem, rational-rank and rational-kernel
    clauses, coefficient census and exact norm formulas, rational normalized-fibre and slab claims,
    adjacent-corner metric-dimension and named capacity-jump statements, and executable decoder
    correctness, termination, and complexity are not formalized as corresponding paper-level Lean
    theorems in this release.
