fidelity:
  divergences: >-
    This is a conditional uniform finite-view reduction, not an end-to-end formalization of
    the paper or an executable LOCAL machine. GoodOneBitOracle assumes only a sufficient one-sided
    orientation outdegree bound for a supplied total finite-view function; the published algorithm
    and its normalization are not proved. Computability and a polynomial growth bound on T
    are not assumed or concluded. The assembled recovery theorem specializes to connected
    graphs on Fin n, canonical IDs v.val+1, public order n and n>16(k+1); more general geometry
    remains in the library. The conservative symmetric-query radius (4r+1)T(D)+10r+4 exceeds
    the paper's stated bound. The complete-graph lower bound matches the storage budget for
    the full graph class but does not itself establish a matching lower bound within the restricted
    large-connected recovery domain. Mixed small/large disconnected-component assembly remains
    informal. No premise assumes payload recovery, marker correctness for locality, or final
    decoder locality.
