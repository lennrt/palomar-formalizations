fidelity:
  divergences: >-
    This is a partial formalization of the paper's headline theorem, not a
    complete formal LOCAL implementation. The selected reconstruction
    theorem assumes a boundary-orientation family with sufficient good advice;
    the library proves its residual-quotient lift but not the published
    algorithm. Its decoder is uniform over root sets on a fixed graph, while
    the selected quantitative locality conclusion fixes the marker set.
    Correctness and locality use one decoder witness; advice recovery uses
    the independently defined ordered packet-parity reader on the same labels.
    Such an extensional
    fixed-topology function may use global precomputation; the theorem does
    not assert uniform operational behavior across different graphs.
    Separate cell
    and packet results permit changing markers on that fixed topology.
    Supplied linear orders determine storage order independently of the
    injective identifiers used to break distance ties; the manuscript uses
    identifier-induced orders. No premise assumes recovery of edge labels.
