status:
  scope: >-
    Eight independently stated selected theorems are proved from the included LocalDecompression
    library and pinned Mathlib. uniformFiniteViewReconstruction fixes F,T,k, then chooses
    one decoder family before n, all physical graphs, marker patterns, advice and payloads.
    The orientation premise concerns only the existence of good one-bit advice for the same
    total finite-view rule, with exact public graph order and degree and polynomial-range
    identifiers. Recovery on connected Fin n graphs with n>16(k+1) and maximum degree at most
    2k-1 uses canonical IDs v.val+1 and public n. Either endpoint recovers each edge bit.
    Locality holds for arbitrary labels on any two connected graphs on the same Fin n, including
    malformed markers, uncovered vertices and nonedges, without degree, balance, coverage
    or encoded-image premises. With r=16(k+1), R=2r and D=(2k-1)(2k)^R, the radius is K=(3R+2)+(2R+1)(T(D)+1)+1.
    The proof constructs separated covering roots, bounds the residual quotient degree, pads
    its order to n+D+1 and exact degree to D, obtains advice before choosing payload, and
    proves actual packet, fiber-rank and orientation compatibility with the original vertex
    encoder. The complete supplied modules and earlier fixed-graph reconstruction remain available.
    Challenge's eight placeholders are isolated comparison goals. External-oracle existence,
    operational computability and final small/disconnected-component assembly are not claimed
    formal conclusions.
