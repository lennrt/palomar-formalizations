version: "v0.4"
project:
  name: "Optimal Local Decompression: Finite Reduction and Graph Geometry"
  description: >-
    Finite reconstruction and geometric foundations of a counting-optimal
    vertex-label scheme for arbitrary edge subsets at fixed odd maximum
    degree 2k-1. On each connected component with more than 16(k+1) vertices,
    a single decoder, chosen before the roots and advice,
    reconstructs every edge-bit assignment and the exact marker set from
    k bits per vertex, conditional on an explicit boundary outdegree bound.
    An explicit ordered packet reader recovers the supplied advice from the
    same labels. The same decoder has physical label radius (4r+1)T+8r+2
    for roots covering within 2r and T-local orientation on the actual cell
    quotient, with physical topology and marker set fixed in the comparison.
    Eight selected statements cover the marked advice-first codec, explicit
    odd-degree capacity, complete-graph counting lower bound, existence of
    bounded connected nearest-root partitions, and bounded-cell geometry and
    stability on arbitrary labels. All substantive proof modules are included.
    The manuscript's full unconditional synchronous LOCAL theorem remains
    partially mechanized: the published orientation algorithm and its
    operational simulation and totalization are documented dependencies,
    not Lean axioms or claimed formal endpoints.
  authors:
    - "Lennart Rudolph"
  responsible_maintainers:
    - "Lennart Rudolph"
  license: "MIT"
