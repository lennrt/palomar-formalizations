status:
  scope: >-
    Eight independently stated selected theorems, proved from the included
    LocalDecompression library and pinned Mathlib. The graph theorem fixes
    actual topology, identifiers and orientation family, then chooses one
    decoder before all root sets, advice and edge payloads. It proves exact
    marker recovery and all-payload roundtrip under a one-sided boundary
    orientation bound, and exact recovery of the supplied advice from those
    same labels by a specified ordered packet reader at every covering radius.
    The same decoder satisfies the physical label-locality
    radius (4r+1)T+8r+2 at an edge's smaller endpoint when roots cover within 2r
    and orientation depends only on radius-T advice in the actual cell quotient.
    This applies to all labels with the fixed marker set, including malformed
    payloads. The quotient has edges exactly at physical cell crossings;
    locality uses quotient walks rather than totalized natural distance.
    Partition existence, geodesic connectivity, degree-only
    cardinality bounds and arbitrary-label radius-2R cell stability are
    selected, alongside capacity, codec and counting endpoints. The retained
    library additionally proves the canonical graph presentation, residual
    simple quotient, parallel-edge pairing and orientation lift, fixed-marker
    assembled decoder locality, across-marker packet stability, bounded
    ordered advice readers, small-component recognition and exact virtual
    padding parameters. Challenge's eight intentional placeholders are not
    dependencies of any proved declaration. The full operational distributed
    theorem, external orientation algorithm, cross-topology simulation,
    totalization and mixed-component assembly remain paper-level arguments.
