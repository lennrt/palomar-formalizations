fidelity:
  divergences: The graph is the actual finite simple graph; Conjecture 24 assumes connectedness, degree
    three at every vertex, no bridges and at least ten vertices. No routing, decomposition or classification
    hypothesis replaces a proved step. Every geodesic zombie reply is adversarial. The zombie chooses
    first and moves first; the survivor may pass; damage is credited on departure after a survived zombie
    turn. Entering the occupied zombie vertex is normalized to a pass, with payoff equivalence proved
    for every damaged-set objective in OccupiedVertexNormalization.lean. The finite numerical value is
    the maximal forceable score, and the threshold, eventual-horizon and full-damage equivalences are
    proved. Zero is the default score where no distinct starting pair exists. The formal graph-order upper
    bound also prevents empty-graph vacuity from creating positive scores. No claim covers every historical
    theorem in Davila’s paper. The structural classification has an explicit one-port alternative; the
    proof derives that this alternative cannot occur for a short-edge component in the bridgeless cubic
    application. The general degree-independent interface theorem and the ring family's structural connection
    to recurrence are written-only; the complete cubic application and recurrence theorem are proved.
    The involution obstruction, central-pair sensor lemma and ring sensor bound remain proved but are
    supplementary library material outside the 39-result selection. No computational census or historical
    regression count is a formal theorem claim.
    Twelve selections use transparent PalomarVerified wrappers to avoid Palomar's known core-notation
    alias bug (PalomarSubmission issue 134). Four helpers have the literal original degree, vertex-pair,
    equality and inequality definitions; every wrapper is proved by a direct application of its original
    theorem. The other 27 selections keep their original names. All 13 wrappers and all 135 supplied
    library sources are unchanged; verification/selection-map.json records the selected mapping.
review:
  status: AI-assisted source and mathematical review; not independently human-refereed
  reviewers: []
  notes: The selection is limited to 39 pursuit and short-cycle results; the three separate sensing
    results remain proved in the library but are not advertised as selected research results.
    VERIFICATION.md distinguishes the revised-selection checks from the historical 42-result checks.
    Source and mathematical review was AI-assisted, with no independent human refereeing or editorial
    acceptance claimed.
