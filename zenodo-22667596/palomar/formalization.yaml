status:
  scope: Full formalization of Randy Davila’s one-zombie damage game and the complete proof of his Conjecture
    24. The game includes shortest-walk geodesic replies, adversarial choices, start and turn order, survivor
    passes, capture, distinct-vertex damage, bounded and eventual strategies, and an explicit numerical
    damage value. For every finite simple connected bridgeless cubic graph of order n at least 10, the
    survivor can force damage to all n vertices within 2n(n+1) survivor moves. The project also proves
    the four-exception characterization, structural classification, routing, recurrence and related bounds.
    All proof sources are included in one Lake project. This includes the complete game semantics and
    the stated results, not every theorem or a numerical solver for arbitrary graphs in Davila’s paper.
    The 39 selected declarations concern pursuit, its game semantics and the short-cycle structure
    and routing used by the full-damage argument, including structural corollaries and recurrence.
    Three distance-shell and diamond-ring sensing results remain as unselected supplementary library
    material with explicit attribution to earlier work. The paper's degree-independent arbitrary-game interface theorem
    (Theorem 13) remains a written abstraction; Lean proves its complete cubic-zombie application directly.
    Remark 19's ring-structure connection to recurrence remains written-only; its observation obstruction
    and sensor lower bound are formalized but unselected. Computational census counts and historical regression checks
    are tests, not additional formal theorem claims.
  sorry_count: 0
  sorry_in_definitions: 0
  sorry_count_scope: Solution and all its dependencies have no proof holes. Challenge independently states
    all 39 selected results with 39 deliberate statement holes and imports only Std and Mathlib. The isolated
    GameChallenge retains the additional 24-statement regression comparison, including two supplementary
    sensing statements; that configuration is not the Palomar submission. Neither challenge is imported by any proof.
  axiom_audit_status: All 276 axiom roots (263 supplied declarations plus 13 interface wrappers) are retained.
    The previous 42-result and 24-result comparisons passed Comparator and NanoDa and the audit reported
    only propext, Quot.sound and Classical.choice. Revised-selection verification is recorded separately
    in VERIFICATION.md; historical reports are not evidence for a changed Challenge snapshot.
