# formalization.yaml v0.4; Palomar profile 4
version: v0.4
project:
  name: Short-Cycle Decompositions and Full Zombie Damage in Cubic Graphs
  description: For every finite simple connected bridgeless cubic graph G, the survivor can force full
    zombie damage if and only if G is not isomorphic to K4, K3,3, the triangular prism or the cube.
    In particular, for order n at least 10 this proves Randy Davila's Conjecture 24, zdmg(G)=n,
    with an explicit bound of 2n(n+1) survivor moves against every initial zombie position and
    every legal geodesic reply. The game formalization retains starting and turn order, survivor
    passes, capture and distinct-vertex damage, and proves the numerical payoff's connection to
    bounded and eventual strategies. The argument classifies short-cycle components, bounds their
    boundaries by four ports and composes metric exit and target routes into an ambient-graph
    strategy. Structural expansion corollaries and recurrent-coverage extensions accompany the
    characterization. The 39 selected results connect structural cubic-graph theory with extremal
    damage and worst-case strategies in graph pursuit. All proof sources are included in one Lake project.
  authors:
  - Lennart Rudolph
  responsible_maintainers:
  - Lennart Rudolph
  license: MIT
