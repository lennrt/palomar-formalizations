version: "v0.4"

project:
  name: "Exact finite rank certificate for OneTwo Sobol' dimensions 25--28"
  description: >-
    A complete kernel-replayable certificate that the explicit 16 x 16
    generator rows for OneTwo Sobol' dimensions 25--28 at m = 16 have exact
    rank threshold 5: every one of the 364 four-part selections of total 11
    is proved independent over F_2 and the threshold tests for totals 12
    through 16 are proved to fail, checked end to end by kernel-reduced
    16-column XOR row reduction with no native evaluation. Under the standard
    digital-net criterion stated in the preprint this threshold is the
    quality parameter t = 5 for the block; the census of all 345 pair-aligned
    windows and authentication of the upstream table remain informal.
  authors: ["Lennart Rudolph", "Sol", "Fable"]
  responsible_maintainers: ["Lennart Rudolph"]
  license: "MIT"

classification:
  arxiv: [math.NA, cs.NA]
  msc2020: [11K38, 11K45, 65C05, 65D30]

sources:
  - title: "Exact Projection Quality of OneTwo Sobol' Sequences at 65,536 Points"
    authors: ["Lennart Rudolph", "Sol", "Fable"]
    id: "doi:10.5281/zenodo.21925582"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21925582"
    relationship: formalizes
    note: >-
      Formalizes the dimensions 25--28 finite rank certificate, not the
      complete table-wide census.
    license: "CC-BY-4.0"
  - title: "OneTwo direction-number table"
    type: dataset
    location: "https://doi.org/10.5281/zenodo.21925582"
    relationship: background
    note: >-
      Source of the packed 16 x 16 generator rows for dimensions 25--28 that
      are embedded verbatim in the Challenge; the table is cited and
      distributed through the preprint's record, and its authentication is
      informal and outside the compared statements.

status:
  scope: >-
    Exact kernel-checked rank threshold for the worked dimensions 25--28 block;
    the table-wide census, source download, and digital-net criterion are external.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext]
  main_results:
    - "OneTwoSobolT5.exact_t_five_certificate"

automation:
  methods:
    - method: agent
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "AI-assisted formalization and adversarial review"
      tool_setup: "Lean 4 kernel-reduced XOR row-reduction certificates plus independent exact computations"
    - method: manual
      models: []
      framework: "n/a"
      tool_setup: "Co-author-directed source authentication and mathematical review"
  spend_usd: "not tracked"
  notes: >-
    The three named authors jointly developed, reviewed, and accept
    responsibility for the submitted result.

fidelity:
  divergences: >-
    The formalization covers one worked four-dimensional block and assumes the
    external equivalence between the encoded rank test and the t-value. For the
    Palomar submission, the release's native exhaustive subset evaluator is
    replaced by deterministic 16-column XOR row reduction checked by ordinary
    kernel decide; the packed input rows and threshold claims are unchanged.

review:
  status: "self-assessed"
  reviewers: ["Anthropic Claude (Fable)"]
  notes: >-
    Anthropic Claude (Fable), acting as a co-author, performed an automated
    adversarial self-review pass separate from proof development and checked
    the compared statements against the preprint before release. No independent
    human peer review has been performed.

alignment:
  namespace: "OneTwoSobolT5"
  statements:
    - source: "Dimensions 25--28 exact m=16 rank certificate"
      lean: "OneTwoSobolT5.exact_t_five_certificate"
      module: "Solution"
      status: proved
      note: "Checks threshold 5 and explicitly excludes every smaller threshold."

acknowledgements: "Lean and the OneTwo direction-number source cited in the preprint."
