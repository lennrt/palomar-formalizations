status:
  scope: >-
    Theorem 1.1 of the preprint in rank form: for all 345 pair-aligned windows
    of the pinned OneTwo table at m = 16, the exact t-value is 4 for the nine
    windows starting at dimensions 1, 7, 31, 49, 67, 195, 225, 243, 373 and 5
    otherwise, each certified by full row rank at total 16 - t and a
    dependent selection at total 17 - t; the distribution 9 and 336; and the
    dimensions 25 to 28 certificate with every smaller threshold refuted.
    External: the digital-net rank criterion, the discrepancy consequence,
    source authentication, the ancillary depth-15 census, and the
    protected-pair audit.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound]
  main_results:
    - "OneTwoSobolT5.exact_t_five_certificate"
    - "OneTwoSobolT5.census_every_window"
    - "OneTwoSobolT5.census_distribution"

