fidelity:
  divergences: >-
    The formalization assumes the external equivalence between the encoded
    rank test and the t-value. For the Palomar submission, the release's
    native exhaustive subset evaluator is replaced by deterministic
    16-column XOR row reduction checked by ordinary kernel decide; the
    packed input rows and threshold claims are unchanged. The Challenge and
    the census data module store the 692-dimension table as one 256-bit
    literal per dimension and decode it in place by explicit division and
    remainder; the decoded rows enter the compared statements only through
    that decoder.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Lennart Rudolph reviewed the compared statements against the preprint.
    Anthropic Claude (Fable), acting as an automated assistant rather than a
    reviewer of record, ran an adversarial review pass separate from proof
    development before release. No independent human peer review has been
    performed.

