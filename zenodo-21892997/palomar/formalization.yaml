version: "v0.4"

project:
  name: "Actual F₂ flag homology and the dense extremal counterexample family"
  description: >-
    A finite-chain formalization of the F₂ content of Theorem 1.1 and
    Proposition 3.1 in the source paper. Lean defines the literal flag-chain
    groups of a finite graph using unordered edges and three-vertex clique
    faces, their d1 and d2 maps, and actual H1 as ker(d1)/range(d2). It proves
    that the paper's family G_n has F₂ first Betti number exactly two for
    every n at least seven, proves the universal F₂ upper bound beta1 <= 2
    for every n-vertex graph with choose(n,2)-n edges, and bundles these facts
    with the exact density and no-complete-bipartite-spanning obstruction.
    The literal d1-d2 identity is also selected so every Challenge proof hole
    is compared. No compared proof uses native_decide or an external homology
    axiom.
  authors:
    - "Lennart Rudolph"
    - "Sol"
    - "Fable"
  license: "MIT"
  responsible_maintainers:
    - "Lennart Rudolph"

classification:
  arxiv: ["math.CO", "math.AT"]
  msc2020: ["05C35", "05C69", "55U10"]

sources:
  - title: "An Infinite Dense Counterexample Family for Extremal First Betti Numbers of Flag Complexes"
    authors:
      - "Lennart Rudolph"
      - "Sol"
      - "Fable"
    id: "10.5281/zenodo.21892997"
    type: paper
    location: "https://doi.org/10.5281/zenodo.21892997"
    relationship: "formalizes"
    note: >-
      Formalizes, over F₂, the family first-homology calculation in
      Theorem 1.1, the universal upper bound in Proposition 3.1, the exact
      choose(n,2)-n edge count, the strict density comparison, and the
      obstruction to a complete bipartite spanning subgraph. Arbitrary-field,
      integral-homology, and finite-census claims are not selected.
    license: "CC-BY-4.0"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    Four declarations are compared: the structural d1-d2 identity and three
    paper-level results forming the main results group. The
    project formalizes actual degree-one simplicial homology over F₂ for
    finite flag complexes. Its transparent chain model uses graph edges as
    Sym2 subtypes, triangular clique finsets as 2-faces, and the quotient of
    the d1 kernel by the d2 range. The family proof performs the paper's leaf
    reductions directly in this quotient and identifies the K_(2,3) core.
    Proposition 3.1 is proved for every finite graph at the exact edge count:
    isolated vertices give cones, leaves reduce to a component-code normal
    form, and the minimum-degree-two case is reduced to complements of cycles
    and joins. The compared bundle additionally proves the exact edge count,
    density above floor(n^2/4), and absence of a complete bipartite spanning
    subgraph. The scope is F₂ only. Homology over arbitrary fields or Z,
    higher homology, the paper's finite census, and any classification beyond
    the displayed edge-count regime remain external.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "PalomarExtremalFlagBetti.family_actual_flag_h1_exactly_two"
    - "PalomarExtremalFlagBetti.universal_flag_beta1_f2_le_two"
    - "PalomarExtremalFlagBetti.dense_extremal_flag_counterexample_f2"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (Sol)", "Anthropic Claude (Fable)"]
      framework: "OpenAI Codex and Anthropic Claude"
      tool_setup: >-
        Agent-assisted source audit, explicit F₂ chain development, Lean
        proof construction, kernel verification, and adversarial scope review
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based; not tracked"
        hardware: "local machine and hosted APIs"
      prompting_notes: >-
        Human-directed extraction of the paper's leaf, cycle, join, and
        extremal cases; iterative serialized Lean checking; strict separation
        of the proved F₂ result from unformalized coefficient and census
        claims.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Human scope selection, source comparison, proof review, and release
        approval
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based; not tracked"
  notes: >-
    The three named authors collaborated on the scope, statements, proofs,
    review, and release approval.

fidelity:
  divergences: >-
    The paper presents the family reduction and Proposition 3.1 using standard
    independence-complex homotopy tools, including leaf deletion, complements
    of cycles, and joins. Lean proves the required degree-one consequences
    internally in a concrete F₂ chain quotient: explicit cone and leaf
    normal forms, literal cycle calculations, an actual joined-chain quotient
    equivalence, and finite-graph component decompositions. This changes the
    proof vehicle but not the selected F₂ statements. The formalization does
    not promote the result to arbitrary coefficients or integral homology and
    does not formalize the computational census reported elsewhere in the
    paper.

review:
  status: "self-assessed"
  reviewers:
    - "OpenAI Codex (Sol)"
  notes: >-
    The current Sol co-author self-review covers the upgraded actual F₂
    quotient, family beta-one computation, and Proposition 3.1 proof cone. The
    older Fable co-author self-review applied to the earlier graph-certificate/
    Boolean-core selection and does not cover this upgrade. No independent
    human peer review has been performed.

alignment:
  namespace: "PalomarExtremalFlagBetti"
  statements:
    - source: "Simplicial-chain identity underlying the F₂ H1 definition"
      lean: "ExtremalFlagBetti.ActualHomology.flagD1_flagD2"
      module: "Solution"
      status: "proved"
      note: >-
        Mechanical support theorem selected so the transparent Challenge has
        no unselected proof hole; it is not a separate paper-level claim.
    - source: "Theorem 1.1: the explicit family has first Betti number two"
      lean: "PalomarExtremalFlagBetti.family_actual_flag_h1_exactly_two"
      module: "Solution"
      status: "proved"
      note: >-
        Proved for actual flag-complex H1 over F₂, not merely for an abstract
        supplied vector space or the earlier Boolean core surrogate.
    - source: "Proposition 3.1: beta1 is at most two at choose(n,2)-n edges"
      lean: "PalomarExtremalFlagBetti.universal_flag_beta1_f2_le_two"
      module: "Solution"
      status: "proved"
      note: >-
        Universal over all simple graphs on Fin n for n at least seven, with
        beta1 interpreted in the explicit F₂ flag-chain quotient.
    - source: "Theorem 1.1: dense extremal counterexample family"
      lean: "PalomarExtremalFlagBetti.dense_extremal_flag_counterexample_f2"
      module: "Solution"
      status: "proved"
      note: >-
        Bundles the exact edge count, density above floor(n^2/4), family
        beta1=2, the matching universal upper bound, and the absence of a
        complete bipartite spanning subgraph.

acknowledgements: "Lean, Mathlib, OpenAI Codex, and Anthropic Claude."
